<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SnoopyLab">
<meta name="theme-color" content="#0284c7">
<link rel="manifest" href="/manifest.json">
<meta name="robots" content="noindex,nofollow">
<title>回到 Snoopy’s Little Lab</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
  :root {
    --ink: #171717;
    --paper: #fffdf8;
    --cream: #f8f0df;
    --red: #d9383a;
    --yellow: #f5bf36;
    --muted: #6b655d;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    box-sizing: border-box;
    overflow-x: hidden;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background:
      radial-gradient(circle at 12% 18%, rgba(245,191,54,.28) 0 8px, transparent 9px),
      radial-gradient(circle at 88% 78%, rgba(217,56,58,.14) 0 7px, transparent 8px),
      linear-gradient(135deg, #fffaf0 0%, #f7ecd7 48%, #fffdf8 100%);
  }
  body::before, body::after {
    content: "";
    position: fixed;
    width: 230px;
    height: 230px;
    border: 2px solid rgba(23,23,23,.08);
    border-radius: 48% 52% 46% 54%;
    transform: rotate(18deg);
    pointer-events: none;
  }
  body::before { left: -90px; top: -90px; }
  body::after { right: -100px; bottom: -105px; transform: rotate(-22deg); }
  .login-shell {
    width: min(940px, calc(100% - 32px));
    min-height: 570px;
    display: grid;
    grid-template-columns: 1.08fr .92fr;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 28px;
    box-shadow: 12px 12px 0 var(--ink);
    overflow: hidden;
    position: relative;
  }
  .illustration {
    min-height: 520px;
    padding: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(rgba(255,255,255,.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px),
      var(--yellow);
    background-size: 26px 26px;
    border-right: 2px solid var(--ink);
  }
  .snoopy-stage {
    width: 100%;
    height: 320px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .snoopy-stage::before {
    content: "Z · Z · Z";
    position: absolute;
    right: 4px;
    top: 20px;
    font-family: Georgia, serif;
    font-weight: 900;
    font-size: 21px;
    transform: rotate(-8deg);
  }
  .snoopy-stage img {
    width: min(100%, 390px);
    max-height: 275px;
    object-fit: contain;
    filter: drop-shadow(7px 8px 0 rgba(255,255,255,.8));
    animation: floaty 3.4s ease-in-out infinite;
  }
  .woodstock {
    position: absolute;
    width: 74px !important;
    height: 74px;
    object-fit: contain;
    right: 10px;
    bottom: 16px;
    filter: none !important;
    animation-delay: -.8s !important;
  }
  .login-panel {
    padding: 56px 48px 42px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .mini-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 34px;
    font-size: 13px;
    font-weight: 850;
  }
  .mini-brand img { width: 44px; height: 44px; object-fit: contain; }
  .login-panel h2 { margin: 0; font-size: 29px; letter-spacing: -.03em; }
  .login-panel .welcome { margin: 8px 0 30px; color: var(--muted); font-size: 14px; }
  label { display: block; margin-bottom: 9px; font-size: 13px; font-weight: 800; }
  .password-wrap { position: relative; }
  input {
    width: 100%;
    height: 52px;
    padding: 0 52px 0 15px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    outline: none;
    transition: box-shadow .18s, transform .18s;
  }
  input::placeholder {
    font-size: 12.5px;
    color: #8c857b;
    font-weight: 500;
  }
  input:focus { box-shadow: 4px 4px 0 var(--yellow); transform: translate(-1px, -1px); }
  input.masked {
    -webkit-text-security: disc;
    text-security: disc;
  }
  input.unmasked {
    -webkit-text-security: none;
    text-security: none;
  }
  .peek {
    position: absolute;
    right: 8px;
    top: 8px;
    width: 38px;
    height: 36px;
    border: 0;
    border-radius: 9px;
    background: var(--cream);
    cursor: pointer;
    font-size: 17px;
  }
  .submit {
    width: 100%;
    min-height: 52px;
    margin-top: 16px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: var(--red);
    color: #fff;
    box-shadow: 4px 4px 0 var(--ink);
    font: inherit;
    font-weight: 850;
    font-size: 15px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .submit:hover { background: #bd2d30; transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--ink); }
  .submit:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .submit:disabled { opacity: .65; cursor: wait; }
  .error {
    min-height: 21px;
    margin-top: 14px;
    color: #b42324;
    font-size: 13px;
    font-weight: 700;
  }
  .privacy-note {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed #c9c2b7;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.6;
  }
  .login-card-version {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
  }
  .login-version-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: var(--cream);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    font-weight: 800;
    color: var(--ink);
    user-select: all;
  }
  .login-footer {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 650;
    letter-spacing: .02em;
    user-select: none;
  }
  .login-version-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    font-weight: 800;
    color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    user-select: all;
  }
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
  @media (prefers-reduced-motion: reduce) { .snoopy-stage img { animation: none; } }
  @media (max-width: 760px) {
    body { padding: 16px 0 28px; justify-content: flex-start; }
    .login-shell { grid-template-columns: 1fr; box-shadow: 7px 7px 0 var(--ink); }
    .illustration { min-height: 220px; padding: 20px; border-right: 0; border-bottom: 2px solid var(--ink); }
    .snoopy-stage { position: relative; width: 220px; height: 180px; opacity: .96; margin: 0 auto; }
    .snoopy-stage::before, .woodstock { display: none; }
    .login-panel { padding: 34px 28px 30px; }
    .mini-brand { margin-bottom: 20px; }
  }
</style>
</head>
<body>
  <main class="login-shell">
    <section class="illustration" aria-label="Snoopy 欢迎插画">
      <div class="snoopy-stage" aria-hidden="true">
        <img src="/assets/personas/ordinary_doghouse.png" alt="">
        <img class="woodstock" src="/assets/personas/woodstock.png" alt="">
      </div>
    </section>
    <section class="login-panel">
      <div class="mini-brand">
        <img src="/assets/personas/canonical.png" alt="Snoopy">
        <span>Snoopy’s Little Lab · Sanyli.</span>
      </div>
      <form id="loginForm" autocomplete="off" novalidate>
        <div class="password-wrap">
          <input id="password" class="masked" name="snoopy_secret_code" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" placeholder="只有你和 Snoopy 知道的那一句" required autofocus aria-label="只有你和 Snoopy 知道的那一句" aria-describedby="loginError">
          <button class="peek" id="peekButton" type="button" aria-label="显示密码" title="显示或隐藏密码">👀</button>
        </div>
        <button class="submit" id="submitButton" type="submit">🐾 打开我的小实验室</button>
        <div class="error" id="loginError" role="alert" aria-live="polite"></div>
      </form>
      <div class="privacy-note">
        <div class="login-card-version">
          <span>当前发布版本</span>
          <span class="login-version-pill" id="loginCardVersionBadge">🏷️ v1.8.5</span>
        </div>
      </div>
    </section>
  </main>
  <footer class="login-footer">
    <span>Snoopy’s Little Lab · Sanyli.</span>
    <span class="login-version-badge" id="loginFooterVersionBadge" title="当前发布版本（每次更新递增）">🏷️ v1.8.5</span>
  </footer>
<script>
  window.APP_VERSION = 'v1.8.5';
  const form = document.getElementById('loginForm');
  const passwordInput = document.getElementById('password');
  const submitButton = document.getElementById('submitButton');
  const loginError = document.getElementById('loginError');

  document.getElementById('peekButton').addEventListener('click', function() {
    const isMasked = passwordInput.classList.contains('masked');
    if (isMasked) {
      passwordInput.classList.remove('masked');
      passwordInput.classList.add('unmasked');
      this.textContent = '🙈';
      this.setAttribute('aria-label', '隐藏密码');
    } else {
      passwordInput.classList.remove('unmasked');
      passwordInput.classList.add('masked');
      this.textContent = '👀';
      this.setAttribute('aria-label', '显示密码');
    }
    passwordInput.focus();
  });
  let autoLoginTimer = null;
  let isSubmitting = false;
  let lastAttemptedPassword = '';

  async function performLogin() {
    if (isSubmitting) return;
    const password = passwordInput.value.trim();
    if (!password) {
      loginError.textContent = '🐾 Snoopy 竖着耳朵等了半天，还没听到暗号呢～';
      passwordInput.focus();
      return;
    }
    if (password === lastAttemptedPassword) {
      return;
    }
    lastAttemptedPassword = password;
    isSubmitting = true;
    submitButton.disabled = true;
    submitButton.textContent = '正在核对小狗爪印…';
    loginError.textContent = '';
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const result = await response.json();
      if (response.ok && result.success) {
        submitButton.textContent = '欢迎回家！🐾';
        window.location.replace('/');
        return;
      }
      if (response.status === 429) {
        loginError.textContent = '尝试次数有点多，Snoopy 需要趴在狗屋顶上休息 15 分钟。';
      } else {
        loginError.textContent = '🙊 哎呀，这句暗号差一点点，再想想看？';
      }
      passwordInput.select();
    } catch (error) {
      loginError.textContent = '暂时联系不上小实验室，请稍后重试。';
    } finally {
      isSubmitting = false;
      submitButton.disabled = false;
      submitButton.textContent = '🐾 打开我的小实验室';
    }
  }

  form.addEventListener('submit', function(event) {
    event.preventDefault();
    if (autoLoginTimer) clearTimeout(autoLoginTimer);
    lastAttemptedPassword = '';
    performLogin();
  });

  passwordInput.addEventListener('input', function() {
    if (autoLoginTimer) clearTimeout(autoLoginTimer);
    const val = passwordInput.value.trim();
    if (!val) {
      lastAttemptedPassword = '';
      return;
    }

    // 1. 若为 6 位纯数字口令，输完第 6 位瞬间立即自动验证登录
    if (/^\d{6}$/.test(val)) {
      performLogin();
      return;
    }

    // 2. 其它口令输入停顿 500ms 后自动提交登录
    if (val.length >= 2) {
      autoLoginTimer = setTimeout(() => {
        performLogin();
      }, 500);
    }
  });

  passwordInput.addEventListener('paste', function() {
    setTimeout(() => {
      const val = passwordInput.value.trim();
      if (val.length >= 2) {
        lastAttemptedPassword = '';
        performLogin();
      }
    }, 50);
  });
</script>
</body>
</html>
